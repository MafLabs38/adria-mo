# Pipeline of Adria MO, derived from Geminarr's and from the organization's github-template (dotnet stack), reduced to what Adria MO
# has: the .NET back end (src/) and the static Astro site (web/).
# Pull requests are built and tested here; only develop and main publish an image of the back end.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# Every job has a time limit, three to five times what it takes: a stuck step is stopped and reported in minutes.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: dotnet format src/AdriaMo.slnx --verify-no-changes
      # The checker of the review decisions (docs/review-decisions/README.md) has its own tests, run here.
      - run: python3 -I -m unittest -q
        working-directory: tools/review-decisions
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn lint
        working-directory: web
      - run: yarn format:check
        working-directory: web
      - run: yarn check
        working-directory: web

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet build src/AdriaMo.slnx --configuration Release
      # Exit code 8 means "no test matched the filter" in a project: expected, each project holds one kind.
      - name: Unit tests
        run: >
          dotnet test --solution src/AdriaMo.slnx --configuration Release --no-build --
          --filter-not-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/unit"
      - name: Integration tests
        run: >
          dotnet test --solution src/AdriaMo.slnx --configuration Release --no-build --
          --filter-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/integration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-backend
          path: coverage/

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn test --coverage
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: web/coverage/

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the image of the back end and start it
        run: |
          docker build -t adria-mo:ci .
          docker run -d --name adria-mo -p 8080:8080 adria-mo:ci
          timeout 60 bash -c 'until curl -fs http://localhost:8080/health/live; do sleep 1; done'
      - name: The image runs as a non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' adria-mo:ci)
          echo "user: $user"
          test -n "$user" && test "$user" != "0" && test "$user" != "root"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: web
      - run: yarn build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: yarn e2e --grep @smoke
        working-directory: web
      - if: failure()
        run: docker logs adria-mo
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: web/playwright-report/

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-backend, test-frontend]
    # Runs once a SonarQube server is configured (repository variable + secret). Not for the pull requests of Dependabot: they receive
    # no Actions secret, so the analysis could only fail; their code is analysed when it reaches develop. A skipped job counts as passed.
    if: vars.SONAR_HOST_URL != '' && !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: coverage/
      # Vitest writes the paths of the lcov report relative to web/; SonarQube reads them from the root of the repository.
      - run: sed -i 's#^SF:#SF:web/#' coverage/coverage-frontend/lcov.info
      # Pinned: this job holds the SonarQube token, so a new release must not run in it unreviewed.
      - run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      # The .NET scanner does not read SONAR_TOKEN for `begin`, so the token is an argument of `begin` and `end`. This job runs the
      # pull request's own code (the build): same-repository branch authors are trusted with this secret, and pull requests from
      # forks never get it.
      # Documented exception: docker:S8431 asks for the tag or the digest of a base image, not both. The Dockerfile keeps both on purpose:
      # the digest makes a build reproducible, the tag is what Dependabot follows to move the digest.
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/*.xml"
          /d:sonar.javascript.lcov.reportPaths="coverage/coverage-frontend/lcov.info"
          /d:sonar.exclusions="web/node_modules/**,web/dist/**,web/.astro/**"
          /d:sonar.coverage.exclusions="**/obj/**,**/*.g.cs,**/*.test.ts,web/e2e/**,web/*.config.*,web/src/pages/**,web/src/layouts/**,tools/**"
          /d:sonar.cs.roslyn.ignoreIssues=true
          /d:sonar.qualitygate.wait=true
          /d:sonar.issue.ignore.multicriteria=e1
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="docker:S8431"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="Dockerfile"
      - run: dotnet build src/AdriaMo.slnx
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      # Whatever the gate said, the log and the summary of the run tell why, so that nobody has to open the server to know.
      - name: What SonarQube found
        if: always()
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.event_name == 'pull_request' && '' || github.ref_name }}
        run: python3 tools/sonar/report.py

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action needs a license key on organization repositories; the CLI does not.
      - name: Secret scanning (gitleaks)
        run: |
          # A downloaded scanner runs in a job of a public repository: check it against the published checksums.
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          curl -sSfLO --retry 6 --retry-delay 10 --retry-all-errors "$base/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSfLO --retry 6 --retry-delay 10 --retry-all-errors "$base/gitleaks_8.21.2_checksums.txt"
          grep ' gitleaks_8.21.2_linux_x64.tar.gz$' gitleaks_8.21.2_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Dependency and config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Integrated code only, and only code that passed every gate: pull requests never publish an image.
  # The sandbox runs the develop image; production images (versions) come with the production vertical.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test-backend, test-frontend, e2e-smoke, sonarqube, security]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && needs.e2e-smoke.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=0.0.0-${{ github.ref_name }}.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
