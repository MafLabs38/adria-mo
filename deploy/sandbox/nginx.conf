# The static server of the sandbox: what Cloudflare Pages and R2 do in production (spec §10.3), plus the way to the API.
server {
    listen 8080;
    server_name _;
    root /site;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # The published snapshot: read by the public page, never by the API. Photos are named by their content: cached for good.
    location /data/ {
        alias /publish/;
        add_header X-Content-Type-Options nosniff always;
        location ~ \.json$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location /data/photos/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # The administration's API. Only this proxy reaches the back end, so its X-Forwarded-For is the one the back end trusts.
    location /api/ {
        # Resolved at each request: nginx starts, and keeps serving the public part, while the back end is stopped.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
