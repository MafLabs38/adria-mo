# Included in every location: nginx drops the add_header of the server block in a location that has its own.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
# Only this site's own scripts, styles, images and calls. Astro writes small inline scripts and styles (the islands' loader),
# hence 'unsafe-inline' for those two; no other origin, no framing, no form sent elsewhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
